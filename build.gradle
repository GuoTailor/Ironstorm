buildscript {


    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.3'
        classpath 'com.mobidevelop.robovm:robovm-gradle-plugin:2.3.23'
        classpath "com.badlogicgames.gdx:gdx-tools:1.14.2"

    }
}

allprojects {
    apply plugin: "eclipse"
    apply plugin: 'idea'

    idea {
        module {
            outputDir = file('build/classes/java/main')
            testOutputDir = file('build/classes/java/test')
        }
    }
    version = "$projectVersion"
    ext {
        appName = "phoenix"
        gdxVersion = '1.14.2'
        roboVMVersion = '2.3.23'
        box2DLightsVersion = '1.5'
        ashleyVersion = '1.7.4'
        aiVersion = '1.8.2'
        gdxControllersVersion = '2.2.1'
    }

    repositories {
        mavenLocal()
        mavenCentral()
        google()
        gradlePluginPortal()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
        maven { url "https://jitpack.io" }
    }

    tasks.withType(JavaCompile) {
        targetCompatibility = JavaVersion.VERSION_17
        sourceCompatibility = JavaVersion.VERSION_17
        options.encoding = "UTF-8"
        options.compilerArgs += ["-Xlint:deprecation"]

        options.forkOptions.jvmArgs += [
                '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
                '--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
                '--add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED',
                '--add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED',
                '--add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED',
                '--add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED',
                '--add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
                '--add-opens=java.base/sun.reflect.annotation=ALL-UNNAMED'
        ]
    }
}

configure(project(":annotations")) {
    tasks.withType(JavaCompile) {
        targetCompatibility = JavaVersion.VERSION_17
        sourceCompatibility = 8
        options.fork = true
    }
}
//compile with java 8 compatibility for everything except the annotation project
//:android 也要排除：加 --release 会把 bootclasspath 换成 JDK 的 ct.sym，android.jar 里的类全部找不到
configure(subprojects - project(":annotations") - project(":android")) {
    tasks.withType(JavaCompile) {
        options.compilerArgs.addAll(['--release', '17'])
    }

    tasks.withType(Javadoc) {
        options {
            addStringOption('Xdoclint:none', '-quiet')
            addStringOption('-release', '21')
            encoding('UTF-8')
        }
    }
}

project(":desktop") {
    apply plugin: "java-library"


    dependencies {
        implementation project(":core")
        //桌面端运行时需要 lwjgl3 后端（:core 里只是 compileOnly）
        api "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        api "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-desktop"
        api "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
    }
}

project(":android") {
    apply plugin: "com.android.application"

    configurations { natives }

    dependencies {
        implementation project(":core")
        api "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
        api "com.badlogicgames.gdx:gdx-bullet:$gdxVersion"
        natives "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-armeabi-v7a"
        natives "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-arm64-v8a"
        natives "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-x86"
        natives "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-x86_64"
        natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
        natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
        natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
        natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
        api "com.badlogicgames.gdx:gdx-ai:$aiVersion"

    }
}

project(":ios") {
    apply plugin: "java-library"
    apply plugin: "robovm"


    dependencies {
        implementation project(":core")
        api "com.mobidevelop.robovm:robovm-rt:$roboVMVersion"
        api "com.mobidevelop.robovm:robovm-cocoatouch:$roboVMVersion"
        api "com.badlogicgames.gdx:gdx-backend-robovm-metalangle:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-ios"
        api "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-ios"

    }
}

project(":core") {
    apply plugin: "java-library"

    compileJava.options.fork = true
    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-bullet:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-ai:$aiVersion"
        api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
        compileOnly project(":annotations")
        annotationProcessor project(":annotations")
    }
}

project(":annotations") {
    apply plugin: "java-library"

    dependencies {
        implementation 'com.squareup:javapoet:1.12.1'
        implementation files("${System.getProperty('java.home')}/../lib/tools.jar")
    }
}

project(":tools"){
    apply plugin: "java-library"

    dependencies{
        implementation project(":core")

        //for render tests
        api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        api "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
        api "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-desktop"
        api "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    }
}

project(":server") {
    apply plugin: "java"

    //Gradle 9 已移除 project 级 sourceCompatibility，字节码版本统一由上面的 JavaCompile 配置（17）决定
    sourceSets.main.java.srcDirs = [ "src/" ]
    sourceSets.main.resources.srcDirs = ["../assets"]

    project.ext.mainClassName = "com.phoenix.game.server.ServerLauncher"
    project.ext.assetsDir = new File("../assets")

    dependencies {
        implementation project(":core")
        implementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    }

    tasks.register('run', JavaExec) {
        dependsOn classes
        mainClass = project.mainClassName
        classpath = sourceSets.main.runtimeClasspath
        standardInput = System.in
        workingDir = project.assetsDir
        ignoreExitValue = true
        //控制台中文输出（Windows 默认 GBK 会把 UTF-8 中文变 '?'）
        jvmArgs "-Dfile.encoding=UTF-8", "-Dstdout.encoding=UTF-8", "-Dstderr.encoding=UTF-8"
    }

    tasks.register('dist', Jar) {
        duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
        manifest {
            attributes 'Main-Class': project.mainClassName
        }
        dependsOn configurations.runtimeClasspath
        from {
            configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
        }
        with jar
    }

    dist.dependsOn classes
}

import com.badlogic.gdx.tools.texturepacker.TexturePacker

tasks.register('texturePacker') {
    //⚠ 必须用绝对路径：doLast 在 Gradle daemon 里执行，daemon 的工作目录是 $GRADLE_USER_HOME/daemon/<版本>/，
    //  相对路径会被解析到那里（读空目录、写到仓库外），导致任务"成功"但图集根本没变
    //⚠⚠ 输入/输出目录（2026-09-27 修正）：运行期资源根是 `<repo>/assets`（desktop/server/android 三端的
    //  assetsDir 都是 `../assets`），而**完整**的打包输入是 `core/assets-raw/sprites_out/`（1071 张，含
    //  `generated/` 与 ui/icons 的变体）——`core/assets-raw/sprites/` 只有 785 张手绘源图，
    //  直接拿它打包会丢掉 287 个生成出来的区域（`icon-*-small/smaller/tiny` 等），**把运行期图集打坏**。
    //  旧配置（sprites/ → core/assets/sprites/）两头都是错的：输入不完整、输出目录三端都不用。
    project.ext.texturePacker = [file('core/assets-raw/sprites_out/').absolutePath,
                                 file('assets/sprites/').absolutePath, "sprites"]
    doLast {
        if (project.ext.has('texturePacker')) {
            logger.info "Calling TexturePacker: " + texturePacker
            TexturePacker.process(texturePacker[0], texturePacker[1], texturePacker[2])
        }
    }
}

tasks.register('spriteGen', JavaExec) {
    //构建期贴图生成器（对应原版 tools 的 Generators）：生成 cracks-* / floor-*-edge 到
    //core/assets-raw/sprites/blocks/environment/。**生成完必须再跑 `gradlew texturePacker`** 才会进图集。
    dependsOn ':tools:classes'
    group = 'phoenix'
    description = '生成 cracks-* / floor-*-edge 贴图（之后需跑 texturePacker）'
    classpath = project(':tools').sourceSets.main.runtimeClasspath
    mainClass = 'io.anuke.mindustry.Generators'
    //⚠ workingDir 必须是仓库根：Generators 里的输出路径是相对仓库根的
    workingDir = projectDir
}